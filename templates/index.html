<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IR 实时推理模拟</title>
<style>
  :root {
    --bg: #14141f;
    --panel: #1d1d2e;
    --border: #33334a;
    --text: #e6e6f0;
    --dim: #8a8aa0;
    --accent: #00d4aa;
    --bad: #e05555;
    --warn: #f0a030;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Consolas", "Microsoft YaHei", monospace;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; font-weight: 600; }
  .badge {
    font-size: 12px; padding: 3px 10px; border-radius: 12px;
    border: 1px solid var(--border); color: var(--dim); white-space: nowrap;
  }
  .badge.ok { color: var(--accent); border-color: var(--accent); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.bad { color: var(--bad); border-color: var(--bad); }
  #btn-match-filter {
    padding: 3px 8px; font-size: 12px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--dim); cursor: pointer;
  }
  #btn-match-filter.on { color: var(--accent); border-color: var(--accent); }
  #btn-match-filter:hover { border-color: var(--accent); }
  .count-ctl {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim);
    margin-left: auto;
  }
  .count-ctl select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 6px; font-size: 12px; font-family: inherit;
  }
  .tools { display: flex; gap: 6px; margin-left: 10px; align-items: center; }
  .tools .fmt-ctl {
    display: flex; align-items: center; gap: 3px; font-size: 0.75rem; color: var(--text-dim);
  }
  .tools .fmt-ctl select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 5px; font-size: 0.72rem; font-family: inherit;
  }
  .tools button {
    padding: 4px 10px; font-size: 0.78rem; border: 1px solid var(--border);
    border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer;
  }
  .tools button:hover { border-color: var(--accent); }
  .tools button:disabled { opacity: 0.55; cursor: wait; }
  .tools button.rec { color: #fff; background: #c0392b; border-color: #c0392b; }
  .tools button.off { color: var(--warn); border-color: var(--warn); }
  .tools button.on { color: var(--accent); border-color: var(--accent); }
  .toast {
    position: fixed; top: 54px; right: 14px; z-index: 999;
    max-width: 380px; padding: 9px 14px; font-size: 0.78rem; line-height: 1.5;
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 6px; color: var(--text); box-shadow: 0 3px 12px rgba(0,0,0,0.35);
    opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s;
    white-space: pre-line; pointer-events: none;
  }
  .toast.ok { opacity: 1; transform: translateY(0); border-left-color: var(--accent); }
  .toast.err { opacity: 1; transform: translateY(0); border-left-color: #e74c3c; }
  .hat-progress-mask {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center;
  }
  .hat-progress-mask.show { display: flex; }
  .hat-progress-box {
    width: min(420px, 92vw); padding: 22px 24px 20px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45); color: var(--text);
  }
  .hat-progress-box h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
  .hat-progress-box .msg { font-size: 12px; color: var(--dim); margin-bottom: 14px; min-height: 1.4em; }
  .hat-bar {
    height: 10px; border-radius: 5px; background: #2a2a2a; overflow: hidden;
  }
  .hat-bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #3d9e6f, #5ecf95);
    transition: width .25s ease;
  }
  .hat-pct { margin-top: 10px; font-size: 13px; text-align: right; color: var(--dim); }
  #main { flex: 1; display: flex; gap: 12px; padding: 12px; min-height: 0; }
  .panel {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden;
  }
  .panel .title {
    padding: 8px 12px; font-size: 13px; color: var(--dim);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .panel .title select,
  .panel .fc-row select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 6px; font-size: 12px; font-family: inherit;
  }
  .panel .title select { max-width: 58%; }
  .panel .fc-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 6px 12px; font-size: 12px; color: var(--dim);
    border-bottom: 1px solid var(--border);
  }
  .panel .fc-row label { display: flex; align-items: center; gap: 4px; }
  .panel .stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    min-height: 0; padding: 8px; position: relative;
  }
  .heavy-badge {
    position: absolute; left: 12px; top: 12px; z-index: 2;
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    background: rgba(240, 160, 48, 0.92); color: #1a1a1a;
    pointer-events: none; display: none;
  }
  canvas { max-width: 100%; max-height: 100%; background: #000; }
  footer {
    padding: 6px 16px; font-size: 12px; color: var(--dim);
    background: var(--panel); border-top: 1px solid var(--border);
    min-height: 30px; display: flex; align-items: center; gap: 16px;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.ok { background: var(--accent); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .stats-overlay {
    position: absolute; top: 8px; left: 8px; z-index: 10;
    background: rgba(0,0,0,0.6); color: #0f0; font-size: 11px;
    padding: 4px 8px; border-radius: 4px; font-family: monospace;
    pointer-events: none; display: none;
  }
  .stats-overlay.visible { display: block; }
</style>
</head>
<body>

<header>
  <h1>IR 实时推理模拟</h1>
  <span class="badge warn" id="b-cam" data-label="摄像头">摄像头: 连接中</span>
  <span class="badge" id="b-model" data-label="模型">模型: 待加载</span>
  <button id="btn-match-filter" class="on" title="按相机分辨率筛选下拉模型（默认开）。点击可关闭，显示全部模型">分辨率筛选</button>
  <label class="count-ctl">面板数
    <select id="panel-count" title="同时对比的面板数量（1～3）">
      <option value="1">1</option>
      <option value="2" selected>2</option>
      <option value="3">3</option>
    </select>
  </label>
  <span class="tools">
    <label class="fmt-ctl">📷
      <select id="snap-fmt">
        <option value="png" selected>PNG</option>
        <option value="jpg">JPG</option>
      </select>
    </label>
    <button id="btn-snap" title="保存当前画面">📷 拍照</button>
    <label class="fmt-ctl">●
      <select id="rec-fmt">
        <option value="avi" selected>AVI</option>
        <option value="mp4" title="使用 MPEG-4(mp4v)，不依赖 OpenH264">MP4</option>
      </select>
    </label>
    <button id="btn-record" title="开始/停止录像">● 录像</button>
    <button id="btn-ffc" title="合上挡板做一次快门校正（FFC）" style="display:none">快门校正</button>
    <button id="btn-cam-toggle" title="断开/重新连接摄像头">🔌 断开相机</button>
    <button id="btn-stats" title="显示/隐藏统计信息（FPS/延迟）">📊 统计</button>
  </span>
</header>

<main id="main"></main>

<footer>
  <span id="cam-detail"><span class="dot warn"></span>等待视频源</span>
</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const mainEl = $('main');

  // Global state
  let statsEnabled = new URLSearchParams(location.search).has('stats');

  // ---- 面板流（每条 WebSocket 对应一个面板）----
  function createPanel(select, canvas, ctx, fcEls, statsEl) {
    let ws = null, current = null, closed = false;
    let decoding = false;  // Frame dropping: skip if decode in flight
    let pendingData = null;  // Latest frame data (drop older ones)
    let frameCount = 0, lastFpsTime = performance.now(), displayFps = 0;

    function getFalseColor() {
      return {
        enabled: !!fcEls.en.checked,
        palette: fcEls.pal.value,
        mode: fcEls.mode.value,
      };
    }
    function sendState() {
      if (ws && ws.readyState === WebSocket.OPEN && current) {
        ws.send(JSON.stringify({ model: current, false_color: getFalseColor(), stats: statsEnabled }));
      }
    }

    function applyDisplayMode() {
      const raw = current === '原图';
      ctx.imageSmoothingEnabled = !raw;
      if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
      canvas.style.imageRendering = raw ? 'pixelated' : 'auto';
    }

    function updateStats(stats) {
      if (!statsEnabled || !statsEl) return;
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        displayFps = Math.round(frameCount * 1000 / (now - lastFpsTime));
        frameCount = 0;
        lastFpsTime = now;
      }
      const age = stats ? Date.now() - stats.ts : 0;
      const infer = stats ? stats.infer_ms : 0;
      const render = stats ? stats.render_ms : 0;
      statsEl.textContent = `FPS: ${displayFps} | 渲染: ${render}ms | 推理: ${infer}ms | 延迟: ${age}ms`;
    }

    function sendAck() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ ack: true }));
      }
    }

    function processFrame(data) {
      // Ack on receipt (before decode) to allow pipelining - server can
      // start rendering next frame while we decode this one
      sendAck();

      if (decoding) {
        pendingData = data;  // Drop: keep only newest
        return;
      }
      decoding = true;

      // Parse stats header if present (4-byte little-endian length prefix)
      let stats = null, jpegData = data;
      if (data instanceof ArrayBuffer && data.byteLength > 4) {
        const arr = new Uint8Array(data);
        const dv = new DataView(data);
        const headerLen = dv.getUint32(0, true);  // little-endian
        if (headerLen > 0 && headerLen < 500 && 4 + headerLen < data.byteLength) {
          try {
            const headerStr = new TextDecoder().decode(arr.slice(4, 4 + headerLen));
            stats = JSON.parse(headerStr);
            jpegData = arr.slice(4 + headerLen).buffer;
          } catch (e) {
            // Fallback: try legacy newline format for compatibility
            const nlIdx = arr.indexOf(10);
            if (nlIdx > 0 && nlIdx < 200) {
              try {
                const headerStr = new TextDecoder().decode(arr.slice(0, nlIdx));
                stats = JSON.parse(headerStr);
                jpegData = arr.slice(nlIdx + 1).buffer;
              } catch (e2) {}
            }
          }
        }
      }

      const blob = new Blob([jpegData], { type: 'image/jpeg' });
      createImageBitmap(blob).then(bmp => {
        applyDisplayMode();
        ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
        bmp.close();
        updateStats(stats);
      }).catch(err => {
        // Decode error - frame corrupted or invalid
        console.warn('Frame decode error:', err);
      }).finally(() => {
        decoding = false;
        // Process pending frame if any (newest only)
        if (pendingData) {
          const next = pendingData;
          pendingData = null;
          processFrame(next);
        }
      });
    }

    function open() {
      if (closed) return;
      ws = new WebSocket(`ws://${location.host}/ws/panel`);
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => sendState();
      ws.onmessage = e => {
        if (typeof e.data === 'string') return;
        processFrame(e.data);
      };
      ws.onclose = () => { if (!closed) setTimeout(open, 1000); };
      ws.onerror = () => ws.close();
    }

    select.addEventListener('change', () => {
      current = select.value;
      applyDisplayMode();
      sendState();
    });
    const onFc = () => sendState();
    fcEls.en.addEventListener('change', onFc);
    fcEls.pal.addEventListener('change', onFc);
    fcEls.mode.addEventListener('change', onFc);

    open();
    return {
      setModel: m => { current = m; select.value = m; applyDisplayMode(); sendState(); },
      getModel: () => current,
      getFalseColor,
      close: () => { closed = true; if (ws) ws.close(); },
      sendUpdate: sendState,
      setStatsVisible: v => { if (statsEl) statsEl.classList.toggle('visible', v); }
    };
  }

  // ---- 全局状态 ----
  let currentOptions = [];        // 当前下拉里的模型名（不含"原图"）
  let allModelOptions = [];       // 全部模型（关闭筛选时用）
  let matchedModelOptions = [];   // 与相机分辨率匹配的模型
  let filterByCamera = true;      // 默认按分辨率筛选
  let heavyModels = new Set();    // 仅拍照/录像的重模型
  let lastCamKey = null;
  let lastCamSize = null;         // [W,H]
  let lastPanelSize = null;       // 固定面板尺寸 [W,H]
  let panels = [];                // { el, select, canvas, ctx, api }

  function isHeavy(name) {
    return heavyModels.has(name);
  }

  function updateHeavyBadge(panel) {
    let badge = panel.el.querySelector('.heavy-badge');
    if (!badge) {
      badge = document.createElement('div');
      badge.className = 'heavy-badge';
      panel.el.querySelector('.stage').appendChild(badge);
    }
    const heavy = isHeavy(panel.api.getModel());
    badge.style.display = heavy ? '' : 'none';
    badge.textContent = heavy ? '仅拍照 · 录像后超分' : '';
  }

  // ---- 面板增删（1~3 个）----
  function fillSelect(select) {
    const options = ['原图'].concat(currentOptions);
    select.innerHTML = options.map(m => {
      const tag = (m !== '原图' && isHeavy(m)) ? '（仅拍照/录像后）' : '';
      return `<option value="${m}">${m}${tag}</option>`;
    }).join('');
  }
  function applyPanelSize(canvas) {
    if (lastPanelSize && lastPanelSize[0]) {
      canvas.width = lastPanelSize[0];
      canvas.height = lastPanelSize[1];
    }
  }
  function addPanel() {
    const n = panels.length + 1;
    const el = document.createElement('div');
    el.className = 'panel';
    el.innerHTML =
      `<div class="title"><span>面板 ${n}</span><select class="model-select"></select></div>` +
      `<div class="fc-row">` +
        `<label title="本面板是否上伪彩"><input type="checkbox" class="fc-en"> 伪彩</label>` +
        `<select class="fc-pal" title="调色板">` +
          `<option value="ironbow">铁虹</option>` +
          `<option value="lava">熔岩</option>` +
          `<option value="rainbow">彩虹</option>` +
          `<option value="white_hot">白热</option>` +
          `<option value="black_hot">黑热</option>` +
        `</select>` +
        `<select class="fc-mode" title="仅LUT映射：对当前画面亮度直接查表。UV插值：先 LUT 得到 Y'UV'，Y' 走超分，只有 UV 双线性放大">` +
          `<option value="lut">仅LUT映射</option>` +
          `<option value="uv">UV插值</option>` +
        `</select>` +
      `</div>` +
      `<div class="stage"><div class="stats-overlay"></div><canvas width="1024" height="768"></canvas></div>`;
    mainEl.appendChild(el);
    const select = el.querySelector('.model-select');
    const canvas = el.querySelector('canvas');
    const statsEl = el.querySelector('.stats-overlay');
    const ctx = canvas.getContext('2d');
    const fcEls = {
      en: el.querySelector('.fc-en'),
      pal: el.querySelector('.fc-pal'),
      mode: el.querySelector('.fc-mode'),
    };
    if (n === 2) fcEls.mode.value = 'uv';
    const api = createPanel(select, canvas, ctx, fcEls, statsEl);
    fillSelect(select);
    applyPanelSize(canvas);
    // 默认：面板1=原图；面板2起依次选不同模型（不够则复用最后一个）
    let defaultModel = '原图';
    if (n > 1 && currentOptions.length) {
      defaultModel = currentOptions[Math.min(n - 2, currentOptions.length - 1)];
    }
    api.setModel(defaultModel);
    api.setStatsVisible(statsEnabled);
    const panel = { el, select, canvas, ctx, api, statsEl };
    select.addEventListener('change', () => updateHeavyBadge(panel));
    panels.push(panel);
    updateHeavyBadge(panel);
  }
  function removePanel() {
    const p = panels.pop();
    if (p.api.close) p.api.close();
    p.el.remove();
  }
  function setPanelCount(n) {
    n = Math.max(1, Math.min(3, n));
    while (panels.length < n) addPanel();
    while (panels.length > n) removePanel();
  }

  // ---- 模型列表刷新（相机分辨率变化时重新匹配）----
  function applyModelFilter() {
    currentOptions = filterByCamera ? matchedModelOptions : allModelOptions;
    const options = ['原图'].concat(currentOptions);
    for (const p of panels) {
      applyPanelSize(p.canvas);
      const prev = p.select.value;
      p.select.innerHTML = options.map(m => {
        const tag = isHeavy(m) ? '（仅拍照/录像后）' : '';
        return `<option value="${m}">${m}${tag}</option>`;
      }).join('');
      if (prev === '原图' || currentOptions.includes(prev)) p.select.value = prev;
      updateHeavyBadge(p);
    }
    for (const p of panels) {
      if (p.api.getModel() !== '原图' && !currentOptions.includes(p.api.getModel())) {
        p.api.setModel('原图');
        updateHeavyBadge(p);
      }
    }
    const btn = $('btn-match-filter');
    if (btn) {
      btn.classList.toggle('on', filterByCamera);
      btn.textContent = filterByCamera ? '分辨率筛选' : '显示全部';
      btn.title = filterByCamera
        ? '已按相机分辨率筛选下拉模型。点击关闭筛选，显示全部模型'
        : '已显示全部模型。点击按相机分辨率筛选';
    }
  }

  async function refreshModels() {
    let models = [], allModels = [], matched = [], camSize = null, panelSize = null, heavy = [];
    try {
      const r = await fetch('/api/models');
      const data = await r.json();
      allModels = data.all_models || data.models || [];
      matched = data.matched_models || data.models || [];
      models = filterByCamera ? matched : allModels;
      heavy = data.heavy_models || [];
      camSize = data.camera_size;
      panelSize = data.panel_size;
    } catch (_) { return camSize; }
    allModelOptions = allModels;
    matchedModelOptions = matched;
    heavyModels = new Set(heavy);
    if (panelSize && panelSize[0]) lastPanelSize = panelSize;

    lastCamSize = camSize;
    applyModelFilter();

    if (camSize && camSize[0]) {
      $('b-cam').className = 'badge ok';
      $('b-cam').textContent = '摄像头: ' + camSize[0] + '×' + camSize[1];
    }
    updateModelBadge();
    return camSize;
  }

  function updateModelBadge() {
    const camSize = lastCamSize;
    const sizeTxt = camSize && camSize[0] ? camSize[0] + '×' + camSize[1] : '?';
    const shown = currentOptions.length;
    const total = allModelOptions.length;
    $('b-model').className = 'badge ' + (shown ? 'ok' : 'bad');
    $('b-model').textContent = filterByCamera
      ? ('模型: ' + shown + ' 个（匹配 ' + sizeTxt + (total > shown ? ' / 共 ' + total : '') + '）')
      : ('模型: 全部 ' + total + ' 个');
  }

  function applyFfcButton(enabled) {
    $('btn-ffc').style.display = enabled ? '' : 'none';
  }

  async function refreshFfcButton() {
    try {
      const r = await (await fetch('/api/camera/status', { cache: 'no-store' })).json();
      applyFfcButton(!!r.ffc);
    } catch (_) {
      applyFfcButton(false);
    }
  }

  async function init() {
    const camSize = await refreshModels();       // 服务端会等相机确定分辨率（最多 5s）
    lastCamKey = camSize && camSize[0] ? camSize.join('x') : '?';
    const n = parseInt($('panel-count').value, 10) || 2;
    setPanelCount(n);
    await refreshFfcButton();
  }

  // ---- 摄像头状态轮询（含分辨率变化 → 重新匹配模型）----
  let lastSeq = null, noFramePolls = 0;
  async function poll() {
    try {
      const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
      if (s.ffc !== undefined) applyFfcButton(!!s.ffc);
      const seq = s.raw_seq || 0;
      if (lastSeq === null) lastSeq = seq;
      if (seq > lastSeq) { lastSeq = seq; noFramePolls = 0; }
      else noFramePolls++;
      const hasCam = s.camera_size && s.camera_size[0] > 0;
      const camOk = hasCam && noFramePolls < 8;   // 连续 8 次(16s)无新帧视为离线
      const size = hasCam ? s.camera_size[0] + '×' + s.camera_size[1] : '?';
      $('b-cam').className = 'badge ' + (camOk ? 'ok' : 'bad');
      $('b-cam').textContent = '摄像头: ' + size + (camOk ? '' : ' 离线');
      $('cam-detail').innerHTML =
        `<span class="dot ${camOk ? 'ok' : 'warn'}"></span>` +
        (camOk ? `视频源正常 (${size})` : '等待视频源');

      // 相机分辨率变化（重插/更换）→ 重新匹配模型
      const key = (s.camera_size || []).join('x') || '?';
      if (key !== lastCamKey) {
        lastCamKey = key;
        if (key !== '?') refreshModels();
      }
    } catch (_) {}
  }

  // 面板数量 1～3
  $('panel-count').addEventListener('change', () => {
    const n = parseInt($('panel-count').value, 10) || 2;
    setPanelCount(n);
  });
  $('btn-match-filter').addEventListener('click', () => {
    filterByCamera = !filterByCamera;
    applyModelFilter();
    updateModelBadge();
  });

  // ---- 工具栏：拍照 / 录像 / 断开相机 ----
  // toast 提示（右上角，3.5s 自动消失）
  const toastEl = document.createElement('div');
  toastEl.id = 'toast'; toastEl.className = 'toast';
  document.body.appendChild(toastEl);
  let toastTimer = null;
  function toast(msg, ok) {
    toastEl.textContent = msg;
    toastEl.className = 'toast ' + (ok ? 'ok' : 'err');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = 'toast'; }, 3500);
  }
  function apiPost(path, body) {
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    }).then(r => r.json());
  }
  function setFoot(msg, ok) {
    $('cam-detail').innerHTML = `<span class="dot ${ok ? 'ok' : 'warn'}"></span>${msg}`;
  }

  // 拍照：按每个面板自己的模型 + 伪彩设置各存一张
  $('btn-snap').addEventListener('click', async () => {
    try {
      if (!panels.length) { toast('无面板', false); return; }
      const fmt = $('snap-fmt').value;
      const hasHeavy = panels.some(p => isHeavy(p.api.getModel()));
      if (hasHeavy) toast('含 HAT：推理较慢，请稍候…', true);
      const rs = await Promise.all(panels.map(p => apiPost('/api/snapshot', {
        model: p.api.getModel(),
        format: fmt,
        false_color: p.api.getFalseColor(),
      })));
      const files = rs.filter(r => r.status === 'ok');
      if (files.length) {
        const names = files.map(f => f.model).join(', ');
        toast(`已保存 ${files.length} 张 (${fmt.toUpperCase()}) → ${files[0].file}\n(${names})`, true);
        setFoot(`已保存 ${files.length} 张`, true);
      } else {
        toast('拍照失败: ' + ((rs[0] && rs[0].message) || '未知错误'), false);
      }
    } catch (e) { toast('拍照失败: ' + e.message, false); }
  });

  // HAT 离线超分进度条
  const hatMask = document.createElement('div');
  hatMask.className = 'hat-progress-mask';
  hatMask.innerHTML = `
    <div class="hat-progress-box">
      <h3>HAT×4 离线超分</h3>
      <div class="msg" id="hat-prog-msg">准备中…</div>
      <div class="hat-bar"><i id="hat-prog-bar"></i></div>
      <div class="hat-pct" id="hat-prog-pct">0%</div>
    </div>`;
  document.body.appendChild(hatMask);
  function showHatProgress(show) {
    hatMask.classList.toggle('show', !!show);
  }
  function setHatProgress(pct, msg) {
    const p = Math.max(0, Math.min(100, pct | 0));
    $('hat-prog-bar').style.width = p + '%';
    $('hat-prog-pct').textContent = p + '%';
    if (msg) $('hat-prog-msg').textContent = msg;
  }
  async function waitHatJob(jobId) {
    showHatProgress(true);
    setHatProgress(0, '已开始离线 HAT 超分…');
    const t0 = Date.now();
    while (true) {
      let q;
      try {
        const resp = await fetch('/api/recording/hat_progress?job_id=' + encodeURIComponent(jobId));
        q = await resp.json();
      } catch (e) {
        showHatProgress(false);
        toast('HAT 进度查询失败: ' + e.message, false);
        return null;
      }
      if (q.status !== 'ok') {
        showHatProgress(false);
        toast('HAT 任务异常: ' + (q.message || '未知'), false);
        return null;
      }
      const pct = q.progress || 0;
      const detail = (q.total > 0)
        ? `${q.message || ''}（${q.current}/${q.total}）`
        : (q.message || '');
      setHatProgress(pct, detail);
      if (q.job_status === 'done') {
        setHatProgress(100, q.message || '完成');
        await new Promise(r => setTimeout(r, 400));
        showHatProgress(false);
        toast(`HAT 超分完成 → ${q.file}`, true);
        setFoot(`HAT 超分完成 → ${q.file}`, true);
        return q;
      }
      if (q.job_status === 'error') {
        showHatProgress(false);
        toast('HAT 超分失败: ' + (q.error || q.message || '未知'), false);
        return null;
      }
      if (Date.now() - t0 > 2 * 60 * 60 * 1000) {
        showHatProgress(false);
        toast('HAT 超分超时（>2h），请检查服务器日志', false);
        return null;
      }
      await new Promise(r => setTimeout(r, 800));
    }
  }

  // 录像：轻量模型实时同帧写入；HAT 录制中不推理，停止后离线超分
  $('btn-record').addEventListener('click', async () => {
    const btn = $('btn-record');
    try {
      if (btn.dataset.rec === '1') {
        const r = await apiPost('/api/recording/stop');
        btn.dataset.rec = '0'; btn.textContent = '● 录像'; btn.classList.remove('rec');
        $('panel-count').disabled = false;
        const cnt = (r.files && r.files.length) || 0;
        const frames = (r.synced_frames != null)
          ? r.synced_frames
          : (r.files && r.files[0] ? r.files[0].frames : 0);
        const counts = (r.files || []).map(f => f.frames);
        const same = counts.length > 0 && counts.every(c => c === counts[0]);
        const detail = same
          ? `（已同步）`
          : `（不一致: ${counts.join('/') }）`;
        toast(`录像已保存 ${cnt} 路 × ${frames} 帧${detail}`, same);
        setFoot(`录像已保存 ${cnt} 路 × ${frames} 帧`, same);
        const ph = r.post_hat;
        if (ph && ph.job_id) {
          await waitHatJob(ph.job_id);
        } else if (ph && ph.status === 'error') {
          toast('HAT 未启动: ' + (ph.message || ''), false);
        }
      } else {
        const jobs = panels.map(p => ({
          model: p.api.getModel(),
          false_color: p.api.getFalseColor(),
        }));
        const fmt = $('rec-fmt').value;
        const wantHat = jobs.some(j => isHeavy(j.model));
        if (wantHat) {
          toast('含 HAT：录制中不超分，停止后离线处理', true);
        }
        const r = await apiPost('/api/recording/start', { panels: jobs, format: fmt });
        if (r.status === 'ok') {
          btn.dataset.rec = '1'; btn.textContent = '■ 停止录像'; btn.classList.add('rec');
          $('panel-count').disabled = true;
          const enc = (r.format || fmt).toUpperCase() + (r.fourcc ? '/' + r.fourcc : '');
          const heavyTip = r.hat_deferred ? ' · HAT改停后' : '';
          const autoTip = r.raw_auto ? '（已自动录原图供HAT）' : '';
          toast(`录像中 ${r.models.length} 路 (${enc}${heavyTip})${autoTip} → ${r.files[0]}`, true);
          setFoot(`录像中 ${r.models.length} 路...`, true);
        } else {
          toast('录像启动失败: ' + r.message, false);
        }
      }
    } catch (e) { toast('录像操作失败: ' + e.message, false); }
  });

  $('btn-ffc').addEventListener('click', async () => {
    const btn = $('btn-ffc');
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      toast('正在快门校正…', true);
      const r = await apiPost('/api/camera/ffc');
      if (r.status === 'ok') {
        toast('快门校正完成', true);
        setFoot('快门校正完成', true);
      } else {
        toast('快门校正失败: ' + (r.message || '未知错误'), false);
      }
    } catch (e) {
      toast('快门校正失败: ' + e.message, false);
    } finally {
      btn.disabled = false;
    }
  });

  // 断开 / 重连相机
  $('btn-cam-toggle').addEventListener('click', async () => {
    const btn = $('btn-cam-toggle');
    try {
      const off = btn.dataset.off === '1';
      const r = await apiPost('/api/camera/' + (off ? 'reconnect' : 'disconnect'));
      if (r.status === 'ok') {
        btn.dataset.off = off ? '0' : '1';
        btn.textContent = off ? '🔌 断开相机' : '🔌 连接相机';
        btn.classList.toggle('off', !off);
        toast(off ? '已重新连接相机' : '已断开相机', true);
        if (off) refreshModels();   // 重连后拉最新模型列表
      }
    } catch (e) { toast('相机操作失败: ' + e.message, false); }
  });

  // Stats toggle
  $('btn-stats').addEventListener('click', () => {
    statsEnabled = !statsEnabled;
    $('btn-stats').classList.toggle('on', statsEnabled);
    for (const p of panels) {
      if (p.api.setStatsVisible) p.api.setStatsVisible(statsEnabled);
      if (p.api.sendUpdate) p.api.sendUpdate();
    }
  });
  // Initialize stats button state
  if (statsEnabled) $('btn-stats').classList.add('on');

  init();
  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
